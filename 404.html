<style>
:root{
  --bg:#FFFFFF; --bg2:#F7F7F6; --card:#F3F3F2; --ink:#0B0B0B; --ink2:#55555A; --dim:#8E8E93;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.15); --chip:rgba(0,0,0,.05); --glow:none;
  --sans:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Instrument Serif', 'Times New Roman', serif;
  --mono:'Geist Mono', ui-monospace, Menlo, monospace;
  --acc:var(--acc-l); color-scheme:light;
}
[data-accent="cobalt"] {--acc-l:#2F4BE0; --acc-d:#93A6FF}
[data-accent="emerald"]{--acc-l:#0A7F58; --acc-d:#47D6A2}
[data-accent="violet"] {--acc-l:#6A45F5; --acc-d:#B4A2FF}
[data-accent="mono"]   {--acc-l:#0B0B0B; --acc-d:#F2F2F2}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0D; --bg2:#121212; --card:#171717; --ink:#F2F2F2; --ink2:#A6A6AB; --dim:#6C6C70;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16); --chip:rgba(255,255,255,.06);
    --glow:0 0 32px rgba(255,255,255,.22); --acc:var(--acc-d); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --bg2:#121212; --card:#171717; --ink:#F2F2F2; --ink2:#A6A6AB; --dim:#6C6C70;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16); --chip:rgba(255,255,255,.06);
  --glow:0 0 32px rgba(255,255,255,.22); --acc:var(--acc-d); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,2.2vw,28px)}
.me{display:flex;align-items:center;gap:10px}
.me img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 25%;box-shadow:0 0 0 1px var(--line2)}
.me b{font-size:14px;font-weight:500}
main{flex:1;display:flex;padding:0 clamp(16px,2.2vw,28px) clamp(16px,2.2vw,28px)}
.win{position:relative;flex:1;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--bg2));overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px -50px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:7px;padding:13px 16px;border-bottom:1px solid var(--line)}
.bar i{width:11px;height:11px;border-radius:50%}
.bar i:nth-child(1){background:#FF5F57}.bar i:nth-child(2){background:#FEBC2E}.bar i:nth-child(3){background:#28C840}
.bar span{margin-left:auto;font:400 12px/1 var(--mono);color:var(--dim)}
canvas{position:absolute;inset:44px 0 0;width:100%;height:calc(100% - 44px);pointer-events:none}
.in{position:relative;z-index:1;flex:1;display:grid;align-content:center;padding:clamp(28px,6vw,96px)}
.code{font:400 12px/1 var(--mono);letter-spacing:.12em;color:var(--dim);margin:0 0 18px}
h1{font:500 clamp(44px,8vw,120px)/.93 var(--sans);letter-spacing:-.05em;margin:0;text-shadow:var(--glow)}
h1 em{font:400 italic 1.08em/.93 var(--serif);letter-spacing:-.02em;color:var(--acc)}
p{max-width:40ch;font-size:clamp(15px,1.35vw,18px);color:var(--ink2);margin:22px 0 30px}
.btn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;width:max-content;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96);transition-duration:.08s}
.btn span{transition:transform .3s cubic-bezier(.22,1,.36,1)}
.btn:hover span{transform:translateX(-3px)}
.fade{opacity:0;transform:translateY(12px);animation:fade .9s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--d,0ms)}
@keyframes fade{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}
</style>

<body>
<header>
  <a class="me" href="/"><img src="/assets/photo.jpg" alt="" width="60" height="60"><b>César Garin</b></a>
</header>
<main>
  <div class="win">
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>~/cesar-garin/404</span></div>
    <canvas id="c" aria-hidden="true"></canvas>
    <div class="in">
      <p class="code fade" style="--d:100ms">ERROR 404</p>
      <h1 class="fade" style="--d:200ms">Page not <em>found.</em></h1>
      <p class="fade" style="--d:350ms">The page you’re looking for doesn’t exist or has moved.</p>
      <a class="btn fade" style="--d:480ms" href="/"><span aria-hidden="true">←</span> Back to home</a>
    </div>
  </div>
</main>
<script>
(() => {
  // A price path that walks along… then drops off the chart.
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let seed = 11; const r = () => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };
  const g = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const T = 220, P = [];
  for (let i = 0; i < 26; i++) { const p = [0]; for (let t = 1; t < T; t++) p.push(p[t - 1] + .0009 + .012 * g()); P.push(p); }
  const hero = P[3].map((y, t) => t < T * .78 ? y : y - Math.pow((t - T * .78) / (T * .22), 2.2) * 2.4);
  function size() { const d = Math.min(2, devicePixelRatio || 1); cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  function draw(f) {
    const w = cv.clientWidth, h = cv.clientHeight, css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue('--ink').trim(), acc = css.getPropertyValue('--acc').trim();
    cx.clearRect(0, 0, w, h);
    const n = Math.max(2, Math.floor(T * f)), x0 = w < 700 ? 0 : w * .25, ym = h * (w < 700 ? .86 : .8), sc = h * .16;
    const line = (p, a, c, lw) => { cx.beginPath(); for (let t = 0; t < n; t++) { const X = x0 + (w - x0) * t / (T - 1), Y = ym - p[t] * sc; t ? cx.lineTo(X, Y) : cx.moveTo(X, Y); } cx.globalAlpha = a; cx.strokeStyle = c; cx.lineWidth = lw; cx.stroke(); };
    P.forEach((p, i) => { if (i !== 3) line(p, .05, ink, 1); });
    line(hero, .7, acc, 1.6);
    if (n > 2) { const t = n - 1; cx.globalAlpha = 1; cx.fillStyle = acc; cx.beginPath(); cx.arc(x0 + (w - x0) * t / (T - 1), ym - hero[t] * sc, 3.2, 0, 7); cx.fill(); }
    cx.globalAlpha = 1;
  }
  size();
  if (reduce) draw(1); else { const t0 = performance.now(); (function a(t) { const k = Math.min(1, (t - t0) / 2600); draw(k); if (k < 1) requestAnimationFrame(a); })(t0); }
  addEventListener('resize', () => { size(); draw(1); });
})();
</script>
